name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name CopyrightGuard \
            --add-data "app/resources/styles/theme.qss:app/resources/styles" \
            main.py

      - name: Create ZIP
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            CopyrightGuard.app \
            CopyrightGuard-v0.2-macOS.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: CopyrightGuard-v0.2-macOS
          path: dist/CopyrightGuard-v0.2-macOS.zip